# Redis de caché para DZ Urban Style (desarrollo local)
# Sin persistencia: si se reinicia, solo se pierden datos cacheados.

# No guardar snapshots en disco (es caché, no fuente de verdad)
save ""
appendonly no

# Tope de memoria: la API nunca debe llenar la RAM de la máquina
maxmemory 64mb
maxmemory-policy allkeys-lru
